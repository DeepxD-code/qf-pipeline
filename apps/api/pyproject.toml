[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "qf-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic", "pydantic-settings", "httpx", "pillow", "python-dotenv", "qf-script", "qf-visuals", "qf-compose"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["qf_api*"]
